name: Android APK

# Сборка подписанного APK. Новый релиз: git tag v0.2.1 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Зависимости
        run: npm ci

      - name: Интерфейс → Android-проект
        run: npm run build:android -w app

      - name: Ключ подписи из секретов
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Секрет ANDROID_KEYSTORE_BASE64 не задан — APK будет без подписи"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Сборка APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          NAME="Ognivo-${VERSION_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release*.apk "$RUNNER_TEMP/$NAME"
          echo "APK=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ognivo-apk
          path: ${{ env.APK }}

      - name: Релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Ognivo $GITHUB_REF_NAME" \
            --notes "Android-приложение Ognivo. Скачайте файл .apk ниже и установите на телефон (разрешите установку из этого источника). Вход — через Telegram-бота @ognivo_tracker_bot."
